[project]
name = "easy-math-lang"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "duo8097", email = "Imanoob8097@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pygls>=2.1.1",
    "pyside6>=6.11.2",
]

[project.scripts]
easy-math-lang = "compiler:main"
easy-math-lsp = "lsp.server:main"
easy-math-editor = "editor.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compiler", "src/editor", "src/geometry", "src/lsp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
