name: Build macOS Installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to a concrete image on purpose; do not use macos-latest
          # because GitHub re-points it without notice; macos-14 retires
          # 2026-11-02.
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install project + build dependencies
        run: uv sync --frozen

      # --- Tag/version guard -------------------------------------------------
      # A tag build must release exactly what pyproject.toml declares:
      # fail fast when vX.Y.Z(-suffix) does not match the project version.
      - name: Guard tag matches pyproject version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            TAG="${TAG#v}"
            VER="$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
            if [ "$TAG" != "$VER" ]; then
              echo "::error::tag '${{ github.ref_name }}' does not match pyproject version '$VER'"
              exit 1
            fi
            echo "tag matches pyproject version $VER"
          else
            echo "not a tag build; skipping version guard"
          fi

      - name: Run test suite (gate releases)
        run: uv run --frozen pytest tests/ --ignore=tests/test_packaged_build -q

      # --- Entry-point shims -------------------------------------------------
      - name: Write entry-point scripts
        shell: bash
        run: |
          cat > entry_compiler.py <<'EOF'
          from compiler import main
          if __name__ == "__main__":
              main()
          EOF

          cat > entry_lsp.py <<'EOF'
          from lsp.server import main
          if __name__ == "__main__":
              main()
          EOF

          cat > entry_editor.py <<'EOF'
          from editor.app import main
          if __name__ == "__main__":
              main()
          EOF

      # --- PyInstaller builds (same flags as Windows, macOS names) -----------
      - name: Build compiler (CLI, onefile)
        run: >
          uv run pyinstaller entry_compiler.py
          --name easy-math-lang
          --onefile
          --collect-all typst
          --collect-all numpy
          --noconfirm

      # `ezmath` is the short CLI alias (pyproject [project.scripts]): same
      # binary under another name, so copy instead of rebuilding.
      - name: Provide ezmath alias binary
        shell: bash
        run: |
          cp -f dist/easy-math-lang dist/ezmath
          chmod +x dist/easy-math-lang dist/ezmath

      - name: Build LSP server (CLI, onefile)
        run: >
          uv run pyinstaller entry_lsp.py
          --name easy-math-lsp
          --onefile
          --collect-all pygls
          --collect-all typst
          --collect-all numpy
          --noconfirm

      - name: Build editor (GUI, onedir)
        run: >
          uv run pyinstaller entry_editor.py
          --name easy-math-editor
          --onedir
          --windowed
          --hidden-import PySide6.QtPdf
          --hidden-import PySide6.QtPdfWidgets
          --collect-all typst
          --collect-all numpy
          --noconfirm

      - name: Show editor bundle size
        shell: bash
        run: du -sh dist/easy-math-editor.app

      # --- Bundle helpers INTO the .app --------------------------------------
      # The DMG ships only easy-math-editor.app: a user may drag just the
      # .app to /Applications, so easy-math-lang / ezmath / easy-math-lsp
      # must live inside it. editor/paths.py already searches
      # Contents/Resources/bin, so no PATH setup is ever needed.
      - name: Bundle helpers into the .app
        shell: bash
        run: |
          APP="dist/easy-math-editor.app"
          if [ ! -d "$APP" ]; then
            echo "::error::expected $APP — PyInstaller --windowed --onedir must emit a bundle"
            find dist -maxdepth 2 | sort
            exit 1
          fi
          mkdir -p "$APP/Contents/Resources/bin"
          cp -f dist/easy-math-lang dist/ezmath dist/easy-math-lsp "$APP/Contents/Resources/bin/"
          chmod +x "$APP/Contents/Resources/bin/"*
          ls -l "$APP/Contents/Resources/bin"

      # --- Prune nested Qt tool apps (must run before signing) -----------------
      # PySide6 bundles Qt developer tools (Assistant, Designer, Linguist)
      # as nested "*__dot__app" dirs with symlinked Info.plist and
      # executables; codesign rejects those, so remove them. Helpers are
      # already bundled at this point, signing has not started yet.
      - name: Remove nested Qt tool apps
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/easy-math-editor.app"
          du -sh dist/easy-math-editor.app
          echo "Nested __dot__app dirs under Frameworks:"
          find "$APP/Contents/Frameworks" -name '*__dot__app' -print
          if [ -d "$APP/Contents/Resources" ]; then
            echo "Nested __dot__app dirs under Resources:"
            find "$APP/Contents/Resources" -name '*__dot__app' -print
          fi
          find "$APP/Contents/Frameworks" -depth -name '*__dot__app' -exec rm -rf {} +
          if [ -d "$APP/Contents/Resources" ]; then
            find "$APP/Contents/Resources" -depth -name '*__dot__app' -exec rm -rf {} +
          fi
          du -sh dist/easy-math-editor.app
          echo "Remaining __dot__app dirs (must be empty):"
          find "$APP/Contents/Frameworks" -name '*__dot__app' -print
          if [ -d "$APP/Contents/Resources" ]; then
            find "$APP/Contents/Resources" -name '*__dot__app' -print
          fi

      # --- Sign (inside-out, fails loudly) -----------------------------------
      # Nested code first, the .app bundle last: signing contents after the
      # bundle would invalidate the bundle seal, so the final sign must not
      # use the recursive flag. No leniency anywhere here (no swallowed
      # exit codes): a broken signature must fail the job, never produce
      # a green build with a bad signature. Only real Mach-O files are
      # signed (never plain directories or scripts): Frameworks holds plain
      # directories such as PySide6/numpy/typst that codesign rejects.
      - name: Sign bundle inside-out
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/easy-math-editor.app"
          # 1. Standalone CLI binaries in dist/.
          codesign --force --sign - dist/easy-math-lang
          codesign --force --sign - dist/ezmath
          codesign --force --sign - dist/easy-math-lsp
          # 2. Bundled helpers must exist and be executable (the Mach-O
          #    loop below covers signing them).
          for h in easy-math-lang ezmath easy-math-lsp; do
            if [ ! -x "$APP/Contents/Resources/bin/$h" ]; then
              echo "::error::missing helper $APP/Contents/Resources/bin/$h"
              exit 1
            fi
          done
          # 3. Nested Mach-O files inside the bundle, regular files only
          #    (find -type f skips symlinks). file(1) decides: sign only
          #    when the output contains Mach-O.
          COUNT=0
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q "Mach-O"; then
              echo "signing $f"
              codesign --force --sign - "$f"
              COUNT=$((COUNT + 1))
            fi
          done < <(find "$APP/Contents" -type f -print0)
          echo "signed $COUNT Mach-O files under $APP/Contents"
          # 4. The bundle itself, last (no --deep).
          codesign --force --sign - "$APP"
          # 5. Verify everything; any failure fails the job. On failure
          #    dump diagnostics before exiting non-zero.
          if codesign --verify --deep --strict --verbose=2 "$APP"; then
            echo "bundle verification OK"
          else
            echo "::error::verification failed for $APP"
            set +e
            codesign -dvvv "$APP"
            find "$APP" -type l | head -50
            set -e
            exit 1
          fi
          codesign --verify --strict --verbose=2 \
            dist/easy-math-lang dist/ezmath dist/easy-math-lsp

      # --- Stage DMG layout --------------------------------------------------
      # Only the .app ships: the old EasyMath/{bin,editor} split duplicated
      # Qt (roughly double DMG size) and broke the editor when a user
      # dragged just the .app to /Applications. The Applications symlink
      # makes drag-and-drop install work.
      - name: Stage DMG folder
        shell: bash
        run: |
          rm -rf staging
          mkdir -p staging
          cp -R "dist/easy-math-editor.app" staging/
          ln -s /Applications staging/Applications
          # Small README so DMG browsers know what to do.
          cat > staging/README.txt <<'EOF'
          Easy Math Lang (macOS)
          ======================
          - Drag "easy-math-editor.app" to the Applications folder
            (a shortcut is included in this disk image), or run it
            straight from here.
          - First launch: right-click the app -> Open (ad-hoc signed,
            not notarized — see docs/installation.md).
          - Helpers (compiler/LSP) live inside the app bundle:
              easy-math-editor.app/Contents/Resources/bin/
            Terminal use:
              BIN="$PWD/easy-math-editor.app/Contents/Resources/bin"
              "$BIN/easy-math-lang" doc.ezmath
            or: export PATH="$BIN:$PATH"
            Export images etc.: easy-math-lang doc.ezmath out.png --format png
          EOF
          find staging -maxdepth 2 | sort

      # --- Smoke test the staged app (not dist/) -----------------------------
      # Must run after staging and before DMG creation so a broken bundle
      # never ships. See scripts/smoke_macos.sh (also runnable on a local
      # Mac after staging).
      - name: Smoke test staged app
        shell: bash
        run: bash scripts/smoke_macos.sh staging

      - name: Create DMG + ZIP
        shell: bash
        run: |
          DMG="EasyMathLang-macOS-${{ matrix.arch }}.dmg"
          ZIP="EasyMathLang-macOS-${{ matrix.arch }}.zip"
          rm -f "$DMG" "$ZIP"
          hdiutil create -volname EasyMathLang -srcfolder staging -ov -format UDZO "$DMG"
          (cd staging && ditto -c -k --sequesterRsrc . "../$ZIP")
          ls -lh "$DMG" "$ZIP"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      # --- Artifacts ---------------------------------------------------------
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EasyMathLang-macOS-${{ matrix.arch }}
          path: |
            EasyMathLang-macOS-${{ matrix.arch }}.dmg
            EasyMathLang-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14

      # --- GitHub Release (tag builds only) ----------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EasyMathLang-macOS-${{ matrix.arch }}.dmg
            EasyMathLang-macOS-${{ matrix.arch }}.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
