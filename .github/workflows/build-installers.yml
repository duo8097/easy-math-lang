name: Build Installers

on:
  push:
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: "0 2 * * *"

# Least privilege: only the release job writes to the repository.
permissions:
  contents: read

# Cancel superseded runs, but never a tag build: it publishes a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Bound parallel freezing to avoid exhausting runner memory.
env:
  EASYMATH_BUILD_JOBS: "2"

jobs:
  build-macos:
    name: Build macOS installer (arm64)
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to a concrete image on purpose; do not use macos-latest
          # because GitHub re-points it without notice; macos-14 retires
          # 2026-11-02.
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project + build dependencies
        run: uv sync --frozen

      # --- Tag/version guard -------------------------------------------------
      # A tag build must release exactly what pyproject.toml declares:
      # fail fast when vX.Y.Z(-suffix) does not match the project version.
      - name: Guard tag matches pyproject version
        run: uv run --frozen python scripts/check_tag_version.py "${{ github.ref }}"

      - name: Run test suite (gate releases)
        run: uv run --frozen pytest tests/ --ignore=tests/test_packaged_build.py -q

      # --- PyInstaller builds ------------------------------------------------
      # One shared builder owns the entry points and the PyInstaller flags
      # (scripts/build_binaries.py), the same script the local build
      # scripts use.
      - name: Build binaries
        run: uv run --frozen python scripts/build_binaries.py --jobs "$EASYMATH_BUILD_JOBS"

      # --- Package the .app --------------------------------------------------
      # Bundles the helpers into the .app, prunes the nested Qt tool apps
      # and signs the bundle inside-out (scripts/package_macos.sh).
      - name: Package the .app bundle
        run: bash scripts/package_macos.sh --stage

      # --- Smoke test the staged app (not dist/) -----------------------------
      # Must run after staging and before DMG creation so a broken bundle
      # never ships. See scripts/smoke_macos.sh (also runnable on a local
      # Mac after staging).
      - name: Smoke test staged app
        shell: bash
        run: bash scripts/smoke_macos.sh staging

      - name: Create DMG
        shell: bash
        run: |
          DMG="EasyMathLang-macOS-${{ matrix.arch }}.dmg"
          rm -f "$DMG"
          hdiutil create -volname EasyMathLang -srcfolder staging -ov -format UDZO "$DMG"
          ls -lh "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      # --- Artifacts ---------------------------------------------------------
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: EasyMathLang-macOS-${{ matrix.arch }}
          path: EasyMathLang-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 14
          # Installer payloads are already compressed.
          compression-level: 0

  build-linux-binary:
    name: Build Linux binary bundle (amd64)
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to a concrete image on purpose; do not use
          # ubuntu-latest because GitHub re-points it without notice.
          - runner: ubuntu-24.04
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project + build dependencies
        run: uv sync --frozen

      # rpm is NOT needed here (rpm tooling lives in build-rpm); dpkg is
      # not needed either (deb tooling lives in build-deb).
      - name: Install system dependencies (Qt libs)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 zstd

      # --- Tag/version guard -------------------------------------------------
      # A tag build must release exactly what pyproject.toml declares:
      # fail fast when vX.Y.Z(-suffix) does not match the project version.
      - name: Guard tag matches pyproject version
        run: uv run --frozen python scripts/check_tag_version.py "${{ github.ref }}"

      - name: Run test suite (gate releases)
        run: uv run --frozen pytest tests/ --ignore=tests/test_packaged_build.py -q

      # --- fcitx5 IME plugin (built from source against PySide6's Qt) ------
      # Frozen Linux builds ship a plugin compiled from source against
      # EXACTLY the Qt PySide6 bundles (detected, never hardcoded), so the
      # frozen editor works with fcitx5 out of the box. The distro's apt
      # plugin targets the distro's Qt and is never bundled.
      # The fcitx5-qt ref lives in scripts/fcitx5_qt_ref.txt; the Qt SDK
      # and the built plugin are cached across runs (keyed on the Qt
      # version, the plugin ref and the runner image).
      - name: Detect PySide6 Qt version
        id: qtver
        run: |
          set -euo pipefail
          QT_VERSION="$(uv run --frozen python -c "from PySide6.QtCore import qVersion; print(qVersion())")"
          echo "qt_version=$QT_VERSION" >> "$GITHUB_OUTPUT"
          echo "QT_ROOT_DIR=$RUNNER_TEMP/qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"
          FCITX5_QT_REF="$(tr -d '[:space:]' < scripts/fcitx5_qt_ref.txt)"
          echo "fcitx5_qt_ref=$FCITX5_QT_REF" >> "$GITHUB_OUTPUT"
          echo "PySide6 Qt version: $QT_VERSION; fcitx5-qt ref: $FCITX5_QT_REF"

      - name: Cache the Qt SDK
        id: cache-qt
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/qt
          key: qt-sdk-${{ steps.qtver.outputs.qt_version }}-${{ matrix.runner }}

      - name: Install exact Qt SDK with headers, cmake config and private headers
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          QT_VERSION="${{ steps.qtver.outputs.qt_version }}"
          uv tool run --from aqtinstall aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 \
            --archives qtbase qtwayland icu -O "$RUNNER_TEMP/qt"

      - name: Verify the Qt SDK (fresh install or cache hit)
        run: |
          set -euo pipefail
          test "$("$QT_ROOT_DIR/bin/qmake" -query QT_VERSION)" = "${{ steps.qtver.outputs.qt_version }}"
          echo "Qt SDK OK: $("$QT_ROOT_DIR/bin/qmake" -query QT_VERSION)"

      - name: Install fcitx5-qt build dependencies
        # libgl*/libopengl/libegl-dev: Qt6Gui's cmake config requires
        # find_package(WrapOpenGL) to succeed (headers + GL/libGL.so stubs).
        # libwayland-dev: Qt6WaylandClient's cmake config requires Wayland
        # client/cursor/server/egl dev files (headers + .so + .pc).
        run: sudo apt-get update && sudo apt-get install -y extra-cmake-modules libxkbcommon-dev libxcb1-dev libx11-dev libgl-dev libopengl-dev libegl-dev libglx-dev libwayland-dev

      - name: Cache the fcitx5-qt build
        id: cache-fcitx5qt
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/fcitx5-qt
          key: fcitx5-qt-${{ steps.qtver.outputs.fcitx5_qt_ref }}-qt-${{ steps.qtver.outputs.qt_version }}-${{ matrix.runner }}

      - name: Build fcitx5 Qt plugin from source
        id: fcitx5qt-build
        if: steps.cache-fcitx5qt.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/fcitx5-qt"
          git clone --depth 1 --branch "${{ steps.qtver.outputs.fcitx5_qt_ref }}" \
            https://github.com/fcitx/fcitx5-qt.git "$RUNNER_TEMP/fcitx5-qt"
          cmake -S "$RUNNER_TEMP/fcitx5-qt" -B "$RUNNER_TEMP/fcitx5-qt/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_QT4=OFF -DENABLE_QT5=OFF -DENABLE_QT6=ON \
            -DBUILD_ONLY_PLUGIN=ON \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_SKIP_BUILD_RPATH=ON \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build "$RUNNER_TEMP/fcitx5-qt/build"

      - name: Verify the fcitx5 plugin (fresh build or cache hit)
        id: fcitx5qt
        run: |
          set -euo pipefail
          PLUGIN="$(find "$RUNNER_TEMP/fcitx5-qt/build" -name 'libfcitx5platforminputcontextplugin.so' -print -quit)"
          test -n "$PLUGIN"
          test -f "$PLUGIN"
          # The frozen runtime looks for exactly this basename.
          test "$(basename "$PLUGIN")" = "libfcitx5platforminputcontextplugin.so"
          echo "plugin=$PLUGIN" >> "$GITHUB_OUTPUT"
          echo "Built fcitx5 plugin: $PLUGIN"

      # --- Build the shared binary bundle ------------------------------------
      - name: Build the Linux binary bundle
        shell: bash
        env:
          EASYMATH_FCITX5_PLUGIN: ${{ steps.fcitx5qt.outputs.plugin }}
        run: bash installer/build_linux.sh binary

      - name: Verify the fcitx5 plugin ended up in the bundle
        run: test -f dist/easy-math-lang/_internal/PySide6/Qt/plugins/platforminputcontexts/libfcitx5platforminputcontextplugin.so

      - name: Smoke test frozen Linux binaries
        env:
          EASYMATH_RUN_BUILD_TESTS: "1"
        run: uv run --frozen pytest tests/test_packaged_build.py -q

      # --- Hand-off to build-deb / build-rpm ---------------------------------
      # upload-artifact does not preserve file modes for a plain directory
      # upload — a tarball is required so modes, symlinks and the
      # executable bits survive. The artifact name deliberately does NOT
      # match the release job's EasyMathLang* pattern so the bundle is
      # never published as a release asset.
      - name: Pack the bundle for hand-off
        run: |
          set -euo pipefail
          tar --numeric-owner --owner=0 --group=0 --zstd \
            -C dist -cf linux-bundle-amd64.tar.zst easy-math-lang
          ls -lh linux-bundle-amd64.tar.zst
          tar -tf linux-bundle-amd64.tar.zst > bundle.txt
          grep -E 'easy-math-(lang|lsp|editor)$' bundle.txt | head -3
          grep -m1 -F 'easy-math-lang/_internal' bundle.txt
          rm bundle.txt

      - name: Upload binary bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-bundle-amd64
          path: linux-bundle-amd64.tar.zst
          if-no-files-found: error
          # Short-lived hand-off only: the deb/rpm artifacts are the
          # release payloads, this is just the shared input.
          retention-days: 2
          compression-level: 0

  build-deb:
    name: Build Debian/Ubuntu package (amd64)
    needs: build-linux-binary
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      # --- Tag/version guard -------------------------------------------------
      # stdlib-only; the deb job intentionally does not install uv.
      - name: Guard tag matches pyproject version
        run: python3 scripts/check_tag_version.py "${{ github.ref }}"

      - name: Install dpkg tooling
        run: sudo apt-get update && sudo apt-get install -y dpkg zstd

      - name: Download the binary bundle
        uses: actions/download-artifact@v8
        with:
          name: linux-bundle-amd64
          path: bundle/

      - name: Extract the bundle and verify it
        run: |
          set -euo pipefail
          mkdir -p dist
          tar --zstd -xf bundle/linux-bundle-amd64.tar.zst -C dist/
          test -x dist/easy-math-lang/easy-math-lang
          test -x dist/easy-math-lang/easy-math-lsp
          test -x dist/easy-math-lang/easy-math-editor
          test -d dist/easy-math-lang/_internal

      - name: Build the .deb
        run: bash installer/build_linux.sh deb

      # --- Smoke test the .deb (not dist/) ----------------------------------
      # Must run after packaging and before upload so a broken package
      # never ships. Same checks as before the split.
      - name: Smoke test deb install
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg -i dist/EasyMathLang-Debian-amd64.deb
          easy-math-lang --version
          mkdir -p /tmp/smoke
          cp examples/example.ezmath /tmp/smoke/
          (cd /tmp/smoke && easy-math-lang example.ezmath smoke.pdf)
          test -f /tmp/smoke/smoke.pdf
          # The vendored Typst packages for offline *draw must be
          # installed and served without any network access.
          test -f /usr/lib/easy-math-lang/_internal/typst-packages/preview/cetz/0.4.2/typst.toml
          test -f /usr/lib/easy-math-lang/_internal/typst-packages/preview/oxifmt/1.0.0/typst.toml
          test -f /usr/share/licenses/easymath/THIRD_PARTY_LICENSES
          cat > /tmp/smoke/draw.ezmath <<'EOF'
          *draw(
              *point(A = 0, 0)
              *point(B = 3, 4)
              *line(A ; B)
          )
          EOF
          (cd /tmp/smoke && \
            http_proxy=http://127.0.0.1:9 https_proxy=http://127.0.0.1:9 \
            HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 \
            easy-math-lang draw.ezmath draw.pdf)
          test -f /tmp/smoke/draw.pdf
          echo "deb smoke OK"

      # --- Artifact ----------------------------------------------------------
      - name: Upload Debian installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: EasyMathLang-Debian-amd64
          path: dist/EasyMathLang-Debian-amd64.deb
          if-no-files-found: error
          retention-days: 14
          # Installer payloads are already compressed.
          compression-level: 0

  build-rpm:
    name: Build Fedora/RHEL package (x86_64)
    needs: build-linux-binary
    runs-on: ubuntu-24.04
    # Pinned to a concrete Fedora tag on purpose; do not use `latest` —
    # the same stability rule as the runner image pins elsewhere.
    container:
      image: fedora:41
    timeout-minutes: 20

    steps:
      - name: Install build tools
        # rpm-build: rpmbuild + rpm query tooling; tar/zstd: bundle
        # extraction; python3/git: repo checkout and tag guard;
        # mesa-libGL/fontconfig/freetype: shared libs the frozen CLI needs.
        # NOTE: the editor GUI is not smoke-tested in this container (no
        # display) — CLI only, by design.
        run: dnf install -y rpm-build tar zstd git python3 bash findutils mesa-libGL fontconfig freetype

      - name: Checkout repo
        uses: actions/checkout@v7

      # --- Tag/version guard -------------------------------------------------
      # stdlib-only; the rpm job intentionally does not install uv.
      - name: Guard tag matches pyproject version
        run: python3 scripts/check_tag_version.py "${{ github.ref }}"

      - name: Download the binary bundle
        uses: actions/download-artifact@v8
        with:
          name: linux-bundle-amd64
          path: bundle/

      - name: Extract the bundle and verify it
        run: |
          set -euo pipefail
          mkdir -p dist
          tar --zstd -xf bundle/linux-bundle-amd64.tar.zst -C dist/
          test -x dist/easy-math-lang/easy-math-lang
          test -x dist/easy-math-lang/easy-math-lsp
          test -x dist/easy-math-lang/easy-math-editor
          test -d dist/easy-math-lang/_internal

      - name: Build the .rpm
        run: bash installer/build_linux.sh rpm

      - name: Inspect rpm payload
        shell: bash
        run: |
          set -euo pipefail
          rpm -qip dist/EasyMathLang-Fedora-amd64.rpm
          rpm -qlp dist/EasyMathLang-Fedora-amd64.rpm | grep -E "usr/bin/easy-math-(lang|lsp|editor)"
          rpm -qlp dist/EasyMathLang-Fedora-amd64.rpm | grep -F "usr/lib/easy-math-lang/_internal/typst-packages/preview/cetz/0.4.2/typst.toml"
          rpm -qlp dist/EasyMathLang-Fedora-amd64.rpm | grep -F "usr/share/licenses/easymath/THIRD_PARTY_LICENSES"

      # --- Smoke test the .rpm (real install inside the container) ----------
      # No display in the container: the frozen editor (and its Qt libs)
      # are NOT smoke-tested here — CLI only.
      - name: Smoke test rpm install
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y ./dist/EasyMathLang-Fedora-amd64.rpm
          easy-math-lang --version
          mkdir -p /tmp/smoke
          cp examples/example.ezmath /tmp/smoke/
          (cd /tmp/smoke && easy-math-lang example.ezmath smoke.pdf)
          test -f /tmp/smoke/smoke.pdf
          # The vendored Typst packages for offline *draw must be
          # installed and served without any network access.
          test -f /usr/lib/easy-math-lang/_internal/typst-packages/preview/cetz/0.4.2/typst.toml
          test -f /usr/lib/easy-math-lang/_internal/typst-packages/preview/oxifmt/1.0.0/typst.toml
          test -f /usr/share/licenses/easymath/THIRD_PARTY_LICENSES
          cat > /tmp/smoke/draw.ezmath <<'EOF'
          *draw(
              *point(A = 0, 0)
              *point(B = 3, 4)
              *line(A ; B)
          )
          EOF
          (cd /tmp/smoke && \
            http_proxy=http://127.0.0.1:9 https_proxy=http://127.0.0.1:9 \
            HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 \
            easy-math-lang draw.ezmath draw.pdf)
          test -f /tmp/smoke/draw.pdf
          echo "rpm smoke OK"

      # --- Artifact ----------------------------------------------------------
      - name: Upload Fedora installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: EasyMathLang-Fedora-amd64
          path: dist/EasyMathLang-Fedora-amd64.rpm
          if-no-files-found: error
          retention-days: 14
          # Installer payloads are already compressed.
          compression-level: 0

  build-windows:
    name: Build Windows installer
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project + build dependencies
        run: uv sync --frozen

      # --- Tag/version guard -------------------------------------------------
      - name: Guard tag matches pyproject version
        run: uv run --frozen python scripts/check_tag_version.py "${{ github.ref }}"

      - name: Run test suite (gate releases)
        run: uv run --frozen pytest tests/ --ignore=tests/test_packaged_build.py -q

      # --- PyInstaller builds ------------------------------------------------
      - name: Build binaries
        run: ./scripts/build_local.ps1 -Jobs "$env:EASYMATH_BUILD_JOBS"

      # --- Inno Setup --------------------------------------------------------
      - name: Smoke test frozen Windows binaries
        env:
          EASYMATH_RUN_BUILD_TESTS: "1"
        run: uv run --frozen pytest tests/test_packaged_build.py -q

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Read the project version (tomllib)
        shell: bash
        run: |
          set -euo pipefail
          # Same source of truth as scripts/check_tag_version.py: the
          # pyproject.toml version is injected into setup.iss so the
          # installer never carries a hard-coded (stale) AppVersion.
          VERSION="$(uv run --frozen python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "AppVersion=$VERSION"

      - name: Compile installer
        shell: cmd
        run: |
          if "%APP_VERSION%"=="" (
            echo APP_VERSION is not set - the version step failed >&2
            exit /b 1
          )
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=%APP_VERSION% installer\setup.iss

      # --- Smoke test the installed app ---------------------------------------
      # Must run after the installer is compiled and before the artifact is
      # uploaded, so a broken package never ships. The PyInstaller onedir
      # bootloader loads the shared runtime from <exe dir>\_internal; the
      # v6.0.0/v7.0.0 installers copied _internal\* straight into bin\ (the
      # folder itself was lost), so every installed .exe failed with
      # "Failed to load Python DLL ...\bin\_internal\python312.dll".
      # python312.dll tracks .python-version (3.12).
      - name: Smoke test the installer (silent install)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $smokeDir = Join-Path $env:RUNNER_TEMP 'easymath-smoke'
          if (Test-Path $smokeDir) { Remove-Item -Recurse -Force $smokeDir }
          New-Item -ItemType Directory -Path $smokeDir | Out-Null
          $setup = Join-Path $PWD 'installer\Output\EasyMathLang-Windows-x64-Setup.exe'
          if (-not (Test-Path $setup)) {
            Write-Host "::error file=installer/setup.iss::Installer output not found: $setup"
            exit 1
          }
          $proc = Start-Process -FilePath $setup -Wait -PassThru -NoNewWindow `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$smokeDir"
          if ($proc.ExitCode -ne 0) {
            Write-Host "::error file=installer/setup.iss::Silent install of $setup failed with exit code $($proc.ExitCode)."
            exit 1
          }
          $pythonDll = Join-Path $smokeDir 'bin\_internal\python312.dll'
          if (-not (Test-Path $pythonDll)) {
            Write-Host "::error file=installer/setup.iss::Installed app is missing bin\_internal\python312.dll - the shared PyInstaller _internal bundle must be installed to {app}\bin\_internal (not flattened into {app}\bin). See docs/troubleshooting.md and installer/setup.iss [Files]."
            exit 1
          }
          foreach ($exe in @('easy-math-lang.exe', 'ezmath.exe')) {
            $exePath = Join-Path (Join-Path $smokeDir 'bin') $exe
            if (-not (Test-Path $exePath)) {
              Write-Host "::error file=installer/setup.iss::$exePath not found after silent install."
              exit 1
            }
            & $exePath --version
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error file=installer/setup.iss::$exe --version exited with code $LASTEXITCODE - the installed app cannot load bin\_internal\python312.dll (PyInstaller _internal layout). See docs/troubleshooting.md."
              exit 1
            }
          }
          Write-Host "Installer smoke test OK: bin\_internal\python312.dll present; easy-math-lang.exe and ezmath.exe --version exit 0."

      # --- Upgrade-in-place smoke test -----------------------------------------
      # Releases up to 7.0.0 had NO explicit AppId, so Inno used AppName
      # ("Easy Math Lang") as the implicit AppId. The freshly built setup
      # must RECOGNIZE that existing install and upgrade it in place:
      # install the previous release first, then this build over it, and
      # require exactly ONE uninstall entry under HKLM Uninstall.
      # If the previous release asset cannot be downloaded (e.g. forks,
      # or the very first installer release), the step says so and prints
      # the manual procedure instead of pretending to have verified it.
      - name: Upgrade in place from the previous release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'duo8097/easy-math-lang'
          $asset = 'EasyMathLang-Windows-x64-Setup.exe'
          $prevDir = Join-Path $env:RUNNER_TEMP 'easymath-prev-release'
          $upgradeDir = Join-Path $env:RUNNER_TEMP 'easymath-upgrade'
          New-Item -ItemType Directory -Path $prevDir, $upgradeDir -Force | Out-Null
          $prevSetup = $null
          Write-Host 'Looking up the previous release...'
          $tag = (gh release view --repo $repo --json tagName --jq .tagName 2>&1)
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Previous release: $tag — downloading $asset"
            gh release download $tag --repo $repo --pattern $asset --dir $prevDir --clobber
            if ($LASTEXITCODE -eq 0) { $prevSetup = Join-Path $prevDir $asset }
          }
          if ($null -eq $prevSetup -or -not (Test-Path $prevSetup)) {
            Write-Host "::warning::MANUAL CHECK REQUIRED — could not download the previous release asset; the in-place upgrade was NOT verified in CI."
            Write-Host 'Perform this upgrade check by hand before tagging a release:'
            Write-Host '  1. On a Windows machine, install the latest release from'
            Write-Host '     https://github.com/duo8097/easy-math-lang/releases'
            Write-Host "  2. Install this build (installer\Output\EasyMathLang-Windows-x64-Setup.exe) over it."
            Write-Host "  3. In regedit, open HKLM\Software\Microsoft\Windows\CurrentVersion\Uninstall"
            Write-Host "     and check the 'Easy Math Lang' entries — there must be exactly ONE."
            Write-Host '  4. Launch the editor; it must report the new version.'
            exit 0
          }
          Write-Host "Installing previous release $tag into $upgradeDir ..."
          $proc = Start-Process -FilePath $prevSetup -Wait -PassThru -NoNewWindow `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$upgradeDir"
          if ($proc.ExitCode -ne 0) {
            Write-Host "::error file=installer/setup.iss::Previous release silent install failed with exit code $($proc.ExitCode)."
            exit 1
          }
          $newSetup = Join-Path $PWD 'installer\Output\EasyMathLang-Windows-x64-Setup.exe'
          Write-Host "Installing THIS build over it ..."
          $proc = Start-Process -FilePath $newSetup -Wait -PassThru -NoNewWindow `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$upgradeDir"
          if ($proc.ExitCode -ne 0) {
            Write-Host "::error file=installer/setup.iss::Silent install of $newSetup failed with exit code $($proc.ExitCode)."
            exit 1
          }
          # Count uninstall keys for 'Easy Math Lang' across all four
          # locations (HKLM / HKCU x native / WOW6432Node). Use reg query
          # with /k so we match on the KEY NAME (which Inno derives from
          # the AppId), not on the DisplayName property, which PowerShell
          # reads unreliably here; and dump what we find otherwise.
          $views = @('HKLM\Software\Microsoft\Windows\CurrentVersion\Uninstall',
                     'HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall',
                     'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall',
                     'HKCU\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall')
          $found = @()
          foreach ($view in $views) {
            $raw = reg query "$view" /k /f "Easy Math Lang" /s 2>$null
            if ($LASTEXITCODE -eq 0) {
              foreach ($line in $raw) {
                if ($line -match '^HKEY_') { $found += $line.Trim() }
              }
            }
          }
          $unique = $found | Sort-Object -Unique
          $count = $unique.Count
          Write-Host "Uninstall keys mentioning 'Easy Math Lang': $count"
          $unique | ForEach-Object { Write-Host "  $_" }
          $unins = Join-Path $upgradeDir 'unins000.dat'
          Write-Host "unins000.dat present: $(Test-Path $unins)"
          if ($count -ne 1) {
            Write-Host "::error file=installer/setup.iss::Expected exactly ONE uninstall entry for 'Easy Math Lang' after the upgrade, found $count. The AppId in installer/setup.iss must stay equal to AppName (the pre-7.0.0 implicit AppId). See tests/test_installer_script.py and docs/packaging.md."
            exit 1
          }
          $cli = Join-Path $upgradeDir 'bin\easy-math-lang.exe'
          $ver = & $cli --version
          Write-Host "easy-math-lang --version -> $ver"
          if ("$ver" -notmatch [regex]::Escape($env:APP_VERSION)) {
            Write-Host "::error::After the in-place upgrade, easy-math-lang.exe reports '$ver' but the build was APP_VERSION=$env:APP_VERSION — the old install was not actually replaced."
            exit 1
          }
          Write-Host "Upgrade in place OK: exactly one uninstall entry; binary reports $env:APP_VERSION."

      # --- Artifact ----------------------------------------------------------
      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: EasyMathLang-Windows-x64
          path: installer\Output\EasyMathLang-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 14
          # Installer payloads are already compressed.
          compression-level: 0

  build-arch:
    name: Build Arch package (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # makepkg only runs on Arch: build inside an Arch container.
    container:
      image: archlinux:base

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          # base-devel ships makepkg (via pacman), shadow the useradd
          # used below, uv the Python toolchain the PKGBUILD calls.
          # fcitx5-qt provides the system Qt6 input-method plugin that
          # build_binaries.py bundles ONLY when its Qt major.minor
          # matches PySide6's (mismatch skips silently, never fails).
          pacman -Syu --noconfirm --needed base-devel git uv python shadow fcitx5-qt
          # makepkg refuses to run as root: build as an unprivileged user.
          useradd -m -u 1000 builder

      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Hand the workspace to the build user
        shell: bash
        run: chown -R builder "$GITHUB_WORKSPACE"

      # --- Tag/version guard -------------------------------------------------
      # A tag build must release exactly what pyproject.toml declares:
      # fail fast when vX.Y.Z(-suffix) does not match the project version.
      # The guard needs the standard library only, so it runs without a
      # project environment.
      - name: Guard tag matches pyproject version
        shell: bash
        run: python scripts/check_tag_version.py "${{ github.ref }}"

      # --- Build the package --------------------------------------------------
      # installer/build_arch.sh packs the checked-out tree and runs makepkg
      # (the PyInstaller flags come from scripts/build_binaries.py).
      # The test suite already gates the release in the other build jobs.
      - name: Build the Arch package
        shell: bash
        run: su builder -c "cd '$GITHUB_WORKSPACE' && bash installer/build_arch.sh"

      # --- Artifact ----------------------------------------------------------
      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: EasyMathLang-Arch-x86_64
          path: "*.pkg.tar.zst"
          if-no-files-found: error
          retention-days: 14
          # Installer payloads are already compressed.
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-linux-binary, build-deb, build-rpm, build-windows, build-arch]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: EasyMathLang*
          merge-multiple: true
          path: release-files

      # --- Checksums (MANDATORY) ---------------------------------------------
      # The built-in updater verifies every downloaded asset against
      # SHA256SUMS.txt from the SAME release; a release without it makes
      # self-update impossible. Covers every file downloaded above.
      - name: Generate SHA256SUMS.txt
        working-directory: release-files
        run: |
          set -euo pipefail
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq "$(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt | wc -l)"

      - name: Verify all expected release assets are present
        working-directory: release-files
        run: |
          set -euo pipefail
          for f in EasyMathLang-Windows-x64-Setup.exe \
                   EasyMathLang-macOS-arm64.dmg \
                   EasyMathLang-Debian-amd64.deb \
                   EasyMathLang-Fedora-amd64.rpm; do
            test -f "$f" || { echo "::error::missing release asset: $f" >&2; exit 1; }
            grep -F "  $f" SHA256SUMS.txt > /dev/null \
              || { echo "::error::SHA256SUMS.txt does not cover $f" >&2; exit 1; }
          done
          shopt -s nullglob
          arches=(easy-math-lang-git-*-x86_64.pkg.tar.zst)
          test "${#arches[@]}" -eq 1 || { echo "::error::expected exactly one Arch package, found ${#arches[@]}" >&2; exit 1; }
          grep -F "  ${arches[0]}" SHA256SUMS.txt > /dev/null \
            || { echo "::error::SHA256SUMS.txt does not cover ${arches[0]}" >&2; exit 1; }
          echo "Release assets OK ($(ls -1 | wc -l) files, incl. SHA256SUMS.txt)"

      # --- GitHub Release (tag builds only) ----------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-files/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
