name: Build Installers

on:
  push:
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: "0 2 * * *"

# Least privilege: only the release job writes to the repository.
permissions:
  contents: read

# Cancel superseded runs, but never a tag build: it publishes a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Bound parallel freezing to avoid exhausting runner memory.
env:
  EASYMATH_BUILD_JOBS: "2"

jobs:
  build-macos:
    name: Build macOS installer (arm64)
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to a concrete image on purpose; do not use macos-latest
          # because GitHub re-points it without notice; macos-14 retires
          # 2026-11-02.
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project + build dependencies
        run: uv sync --frozen

      # --- Tag/version guard -------------------------------------------------
      # A tag build must release exactly what pyproject.toml declares:
      # fail fast when vX.Y.Z(-suffix) does not match the project version.
      - name: Guard tag matches pyproject version
        run: uv run --frozen python scripts/check_tag_version.py "${{ github.ref }}"

      - name: Run test suite (gate releases)
        run: uv run --frozen pytest tests/ --ignore=tests/test_packaged_build.py -q

      # --- PyInstaller builds ------------------------------------------------
      # One shared builder owns the entry points and the PyInstaller flags
      # (scripts/build_binaries.py), the same script the local build
      # scripts use.
      - name: Build binaries
        run: uv run --frozen python scripts/build_binaries.py --jobs "$EASYMATH_BUILD_JOBS"

      # --- Package the .app --------------------------------------------------
      # Bundles the helpers into the .app, prunes the nested Qt tool apps
      # and signs the bundle inside-out (scripts/package_macos.sh).
      - name: Package the .app bundle
        run: bash scripts/package_macos.sh --stage

      # --- Smoke test the staged app (not dist/) -----------------------------
      # Must run after staging and before DMG creation so a broken bundle
      # never ships. See scripts/smoke_macos.sh (also runnable on a local
      # Mac after staging).
      - name: Smoke test staged app
        shell: bash
        run: bash scripts/smoke_macos.sh staging

      - name: Create DMG
        shell: bash
        run: |
          DMG="EasyMathLang-macOS-${{ matrix.arch }}.dmg"
          rm -f "$DMG"
          hdiutil create -volname EasyMathLang -srcfolder staging -ov -format UDZO "$DMG"
          ls -lh "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      # --- Artifacts ---------------------------------------------------------
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EasyMathLang-macOS-${{ matrix.arch }}
          path: EasyMathLang-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 14
          # Installer payloads are already compressed.
          compression-level: 0

  build-linux:
    name: Build Linux installers (amd64)
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to a concrete image on purpose; do not use
          # ubuntu-latest because GitHub re-points it without notice.
          - runner: ubuntu-24.04
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project + build dependencies
        run: uv sync --frozen

      - name: Install system dependencies (Qt libs, package tooling)
        run: sudo apt-get update && sudo apt-get install -y rpm libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      # --- Tag/version guard -------------------------------------------------
      - name: Guard tag matches pyproject version
        run: uv run --frozen python scripts/check_tag_version.py "${{ github.ref }}"

      - name: Run test suite (gate releases)
        run: uv run --frozen pytest tests/ --ignore=tests/test_packaged_build.py -q

      # --- Build .deb + .rpm (same flags as Windows/macOS, Linux names) -----
      - name: Build Linux installers
        shell: bash
        run: bash installer/build_linux.sh

      - name: Smoke test frozen Linux binaries
        env:
          EASYMATH_RUN_BUILD_TESTS: "1"
        run: uv run --frozen pytest tests/test_packaged_build.py -q

      # --- Smoke test the .deb (not dist/) -----------------------------------
      # Must run after packaging and before upload so a broken package
      # never ships.
      - name: Smoke test deb install
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg -i dist/EasyMathLang-Debian-amd64.deb
          easy-math-lang --version
          mkdir -p /tmp/smoke
          cp examples/example.ezmath /tmp/smoke/
          (cd /tmp/smoke && easy-math-lang example.ezmath smoke.pdf)
          test -f /tmp/smoke/smoke.pdf
          echo "deb smoke OK"

      - name: Inspect rpm payload
        shell: bash
        run: |
          set -euo pipefail
          rpm -qip dist/EasyMathLang-Fedora-amd64.rpm
          rpm -qlp dist/EasyMathLang-Fedora-amd64.rpm | grep -E "usr/bin/easy-math-(lang|lsp|editor)"

      # --- Artifacts (one per distro family) ---------------------------------
      - name: Upload Debian installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyMathLang-Debian-amd64
          path: dist/EasyMathLang-Debian-amd64.deb
          if-no-files-found: error
          retention-days: 14
          # Installer payloads are already compressed.
          compression-level: 0

      - name: Upload Fedora installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyMathLang-Fedora-amd64
          path: dist/EasyMathLang-Fedora-amd64.rpm
          if-no-files-found: error
          retention-days: 14
          # Installer payloads are already compressed.
          compression-level: 0

  build-windows:
    name: Build Windows installer
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project + build dependencies
        run: uv sync --frozen

      # --- Tag/version guard -------------------------------------------------
      - name: Guard tag matches pyproject version
        run: uv run --frozen python scripts/check_tag_version.py "${{ github.ref }}"

      - name: Run test suite (gate releases)
        run: uv run --frozen pytest tests/ --ignore=tests/test_packaged_build.py -q

      # --- PyInstaller builds ------------------------------------------------
      - name: Build binaries
        run: ./scripts/build_local.ps1 -Jobs "$env:EASYMATH_BUILD_JOBS"

      # --- Inno Setup --------------------------------------------------------
      - name: Smoke test frozen Windows binaries
        env:
          EASYMATH_RUN_BUILD_TESTS: "1"
        run: uv run --frozen pytest tests/test_packaged_build.py -q

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss

      # --- Artifact ----------------------------------------------------------
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyMathLang-Windows-x64
          path: installer\Output\EasyMathLang-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 14
          # Installer payloads are already compressed.
          compression-level: 0

  build-arch:
    name: Build Arch package (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # makepkg only runs on Arch: build inside an Arch container.
    container:
      image: archlinux:base

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          # base-devel ships makepkg (via pacman), shadow the useradd
          # used below, uv the Python toolchain the PKGBUILD calls.
          pacman -Syu --noconfirm --needed base-devel git uv python shadow
          # makepkg refuses to run as root: build as an unprivileged user.
          useradd -m -u 1000 builder

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Hand the workspace to the build user
        shell: bash
        run: chown -R builder "$GITHUB_WORKSPACE"

      # --- Tag/version guard -------------------------------------------------
      # A tag build must release exactly what pyproject.toml declares:
      # fail fast when vX.Y.Z(-suffix) does not match the project version.
      # The guard needs the standard library only, so it runs without a
      # project environment.
      - name: Guard tag matches pyproject version
        shell: bash
        run: python scripts/check_tag_version.py "${{ github.ref }}"

      # --- Build the package --------------------------------------------------
      # installer/build_arch.sh packs the checked-out tree and runs makepkg
      # (the PyInstaller flags come from scripts/build_binaries.py).
      # The test suite already gates the release in the other build jobs.
      - name: Build the Arch package
        shell: bash
        run: su builder -c "cd '$GITHUB_WORKSPACE' && bash installer/build_arch.sh"

      # --- Artifact ----------------------------------------------------------
      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: EasyMathLang-Arch-x86_64
          path: "*.pkg.tar.zst"
          if-no-files-found: error
          retention-days: 14
          # Installer payloads are already compressed.
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-linux, build-windows, build-arch]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: EasyMathLang*
          merge-multiple: true
          path: release-files

      # --- GitHub Release (tag builds only) ----------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
