name: Build Linux Installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to a concrete image on purpose; do not use
          # ubuntu-latest because GitHub re-points it without notice.
          - runner: ubuntu-24.04
            arch: amd64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install project + build dependencies
        run: uv sync --frozen

      - name: Install system dependencies (Qt libs, package tooling)
        run: sudo apt-get update && sudo apt-get install -y rpm libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      # --- Tag/version guard -------------------------------------------------
      # A tag build must release exactly what pyproject.toml declares:
      # fail fast when vX.Y.Z(-suffix) does not match the project version.
      - name: Guard tag matches pyproject version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            TAG="${TAG#v}"
            VER="$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
            if [ "$TAG" != "$VER" ]; then
              echo "::error::tag '${{ github.ref_name }}' does not match pyproject version '$VER'"
              exit 1
            fi
            echo "tag matches pyproject version $VER"
          else
            echo "not a tag build; skipping version guard"
          fi

      - name: Run test suite (gate releases)
        run: uv run --frozen pytest tests/ --ignore=tests/test_packaged_build -q

      # --- Build .deb + .rpm (same flags as Windows/macOS, Linux names) -----
      - name: Build Linux installers
        shell: bash
        run: bash installer/build_linux.sh

      # --- Smoke test the .deb (not dist/) -----------------------------------
      # Must run after packaging and before upload so a broken package
      # never ships.
      - name: Smoke test deb install
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg -i dist/EasyMathLang-Linux-${{ matrix.arch }}.deb
          easy-math-lang --version
          mkdir -p /tmp/smoke
          cp examples/example.ezmath /tmp/smoke/
          (cd /tmp/smoke && easy-math-lang example.ezmath smoke.pdf)
          test -f /tmp/smoke/smoke.pdf
          echo "deb smoke OK"

      - name: Inspect rpm payload
        shell: bash
        run: |
          set -euo pipefail
          rpm -qip dist/EasyMathLang-Linux-${{ matrix.arch }}.rpm
          rpm -qlp dist/EasyMathLang-Linux-${{ matrix.arch }}.rpm | grep -E "usr/bin/easy-math-(lang|lsp|editor)"

      # --- Artifacts ---------------------------------------------------------
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EasyMathLang-Linux-${{ matrix.arch }}
          path: |
            dist/EasyMathLang-Linux-${{ matrix.arch }}.deb
            dist/EasyMathLang-Linux-${{ matrix.arch }}.rpm
          if-no-files-found: error
          retention-days: 14

      # --- GitHub Release (tag builds only) ----------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EasyMathLang-Linux-${{ matrix.arch }}.deb
            dist/EasyMathLang-Linux-${{ matrix.arch }}.rpm
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
