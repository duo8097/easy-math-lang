# Keep dependencies and actions fresh. Weekly is enough for a project
# this size; open PRs are limited per ecosystem to keep noise low.
# Minor/patch updates are batched into one PR per ecosystem; majors
# arrive as individual PRs (except Qt-adjacent packages, which are
# ignored on major to avoid surprise Qt minor-family jumps).
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "pyside6*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pillow"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typst"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
