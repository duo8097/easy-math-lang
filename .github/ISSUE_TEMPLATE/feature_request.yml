name: Feature request
description: Suggest an idea or a new symbol/command
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas welcome — this project exists to make math writing easier
        for teachers and students.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to write, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to write / see?
      description: A concrete `.ezmath` snippet of what the feature should look like.
      render: text
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Workarounds, other tools, or commands you hoped existed.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this
